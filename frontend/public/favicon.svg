<!-- Pace: the chevron from the sidebar wordmark (src/components/PaceLogo.tsx), on a
     rounded tile so it reads against a tab strip. The glyph's three motion lines are
     dropped here because they merge into one smudge at 16px.

     The embedded media query is why this is an SVG rather than a PNG: a dark tile is
     near-invisible on a dark browser chrome, so the tile and the chevron swap when the
     user's OS is in dark mode. Browsers that ignore it get the light-mode version,
     which is the safe default. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .tile { fill: #1a1a1a; }
    .mark { stroke: #f5f5f3; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f0f0ed; }
      .mark { stroke: #1a1a1a; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7.5" />
  <g class="mark" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 16h3.5" />
    <path d="m15.5 10.5 5.5 5.5-5.5 5.5" />
  </g>
</svg>
