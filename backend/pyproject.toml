[project]
name = "pace-v0"
version = "0.1.0"
description = "Backend API for pace-v0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.18",  # required by FastAPI for multipart/file uploads
    "aioodbc>=0.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modernize syntax)
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long — the formatter handles line length
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
