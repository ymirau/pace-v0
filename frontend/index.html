<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- vite.config.ts rewrites this to prefix the env: "loc - " (local),
         "sbx - …", "uat - …". prod stays unprefixed. -->
    <title>Pace</title>
    <!-- No-FOUC theme bootstrap: set data-theme on <html> to the resolved theme
         (stored manual choice, else OS preference) before the module bundle
         paints. Keep in sync with resolveTheme() in src/theme.ts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* localStorage/matchMedia unavailable — leave the default (light) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
